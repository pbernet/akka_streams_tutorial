<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #chat-container {
            max-width: 800px;
            margin: 0 auto;
        }

        #messages {
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }

        #input-container {
            display: flex;
        }

        #query-input {
            flex-grow: 1;
            padding: 8px;
            margin-right: 10px;
        }

        button {
            padding: 8px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .user-message {
            color: blue;
        }

        .assistant-message {
            color: green;
        }

        pre {
            white-space: pre-wrap;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div id="chat-container">
    <h1>Assistant</h1>
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="query-input" placeholder="What do you know about {a person found in index}">
        <button onclick="sendQuery()">Send</button>
    </div>
</div>

<script>
    function sendQuery() {
        const queryInput = document.getElementById('query-input');
        const query = queryInput.value.trim();

        if (query === '') return;

        addMessage('You: ' + query, 'user-message');
        queryInput.value = '';

        fetch('/assistant/query', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({query: query}),
        })
            .then(response => response.json())
            .then(data => {
                addMessage('Assistant: ' + data.answer, 'assistant-message');
            })
            .catch(error => {
                console.error('Error:', error);
                addMessage('Error: Failed to get response', 'error');
            });
    }

    function addMessage(message, className) {
        const messagesDiv = document.getElementById('messages');
        const messageElement = document.createElement('div');
        messageElement.className = className;

        // Format code blocks if present
        if (message.includes('```')) {
            const parts = message.split(/(```[\s\S]*?```)/);
            let formattedMessage = '';

            for (let i = 0; i < parts.length; i++) {
                if (parts[i].startsWith('```') && parts[i].endsWith('```')) {
                    // Extract the code content (remove the backticks)
                    const code = parts[i].substring(3, parts[i].length - 3);
                    formattedMessage += '<pre>' + code + '</pre>';
                } else {
                    formattedMessage += parts[i];
                }
            }

            messageElement.innerHTML = formattedMessage;
        } else {
            messageElement.textContent = message;
        }

        messagesDiv.appendChild(messageElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    document.getElementById('query-input').addEventListener('keypress', function (event) {
        if (event.key === 'Enter') {
            sendQuery();
        }
    });
</script>
</body>
</html>
